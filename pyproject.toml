[project]
name = "reliable-open-deep-research"
version = "0.1.0"
description = "Recoverable research tasks and evidence-grounded reports, built on LangChain Open Deep Research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-anthropic>=1,<2",
    "langchain-mcp-adapters>=0.2,<0.4",
    "aiohttp>=3.9,<4",
    "pydantic>=2.11,<3",
    "tavily-python>=0.5,<1",
    "python-dotenv>=1,<2",
    "mcp>=1.9.4,<2",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.6"]
benchmark = ["fastembed>=0.7,<0.8", "pymupdf>=1.25.3", "beautifulsoup4>=4.14.3,<5"]
studio = ["langgraph-cli[inmem]>=0.3.1"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_deep_research*"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
